<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workout Log — Dashboard</title>
    <link rel="stylesheet" href="./styles/dashboard.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Тренировочный дашборд</h1>
        <p class="lead">Тренировки, активность и восстановление.</p>
      </header>

      <nav class="tabs" aria-label="Разделы дашборда">
        <button class="tab active" type="button" data-tab="overview">Обзор</button>
        <button class="tab" type="button" data-tab="recomp">Рекомпозиция</button>
      </nav>

      <section class="panel" id="overview">
        <section class="grid" id="dashboard" aria-live="polite">
          <p class="loading">Загрузка...</p>
        </section>
        <section class="card activity-card" id="activity-calendar" aria-live="polite">
          <p class="loading">Загрузка графика активности...</p>
        </section>
      </section>

      <section class="panel" id="recomp" hidden>
        <section class="grid">
          <article class="card wide chart-card">
            <h2>Рекомпозиция</h2>
            <p class="targets">Ориентир: вес 75–78 кг · жир 15–16% · сохраняем узкую талию.</p>
            <div class="metric-buttons" id="metric-buttons"></div>
            <div class="chart-wrap" id="recomp-chart"></div>
            <p class="chart-note" id="chart-note"></p>
          </article>
          <article class="card wide" id="last-measurement" aria-live="polite">
            <p class="loading">Загрузка замеров...</p>
          </article>
        </section>
      </section>

      <section class="quote-reminder">
        <button class="quote-refresh" id="quote-refresh" type="button" aria-label="Другая цитата">↻</button>
        <p class="quote-text" id="quote-text">Загрузка...</p>
        <div id="quote-source"></div>
      </section>
    </main>

    <script type="module" src="./js/app.js?v=20260826"></script>
  </body>
</html>
