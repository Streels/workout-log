<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Log — Dashboard</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--muted:#9ca8b8;--text:#f3f6fa;--accent:#79d7b1;--accent-dim:#1a4a3e;--line:#293241;--empty:#202834}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui}main{max-width:1060px;margin:auto;padding:44px 20px 64px}.lead,.muted{color:var(--muted)}h1{margin:.2em 0}h2{margin:0 0 14px;font-size:1.15rem}.tabs{display:flex;gap:8px;margin:26px 0 16px;border-bottom:1px solid var(--line)}.tab{appearance:none;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:10px 14px;cursor:pointer;font:inherit}.tab.active{color:var(--text);border-color:var(--accent)}.panel[hidden]{display:none}.grid{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.wide{grid-column:span 2}.value{font-size:2rem;font-weight:750}.label{color:var(--muted);font-size:.9rem}table{width:100%;border-collapse:collapse}td{padding:10px 0;border-top:1px solid var(--line)}td:last-child{text-align:right;color:var(--muted)}.quote-reminder{margin-top:30px;padding:18px 42px 0 0;border-top:1px solid var(--line);color:var(--muted);opacity:.82;position:relative}.quote-refresh{position:absolute;right:0;top:14px;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}.quote-text{font-size:.86rem;white-space:pre-line}.discipline-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}.discipline-summary{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:.78rem}.calendar{display:grid;grid-template-columns:64px repeat(7,24px);gap:7px;align-items:center;justify-content:start}.dow{font-size:.68rem;color:var(--muted);text-align:center}.week{font-size:.7rem;color:var(--muted);white-space:nowrap}.day{width:24px;height:16px;border-radius:999px;background:#202834;position:relative;transition:background .15s ease,box-shadow .15s ease}.day.done{background:#21614f;box-shadow:inset 0 0 0 1px rgba(121,215,177,.32)}.day.metric{background:#315d94;box-shadow:inset 0 0 0 1px rgba(146,185,238,.36)}.day.done.metric{background:linear-gradient(90deg,#21614f 0 50%,#315d94 50% 100%);box-shadow:inset 0 0 0 1px rgba(243,246,250,.28)}.day.done::after{content:'✓';position:absolute;inset:0;color:#e2fff5;font-size:.68rem;font-weight:800;line-height:16px;text-align:center}.day.today{box-shadow:0 0 0 1px var(--text),0 0 0 3px rgba(243,246,250,.08)}.day.done.today{box-shadow:inset 0 0 0 1px rgba(121,215,177,.32),0 0 0 1px var(--text),0 0 0 3px rgba(243,246,250,.08)}.day.metric.today,.day.done.metric.today{box-shadow:inset 0 0 0 1px rgba(146,185,238,.36),0 0 0 1px var(--text),0 0 0 3px rgba(243,246,250,.08)}.legend{display:flex;gap:14px;color:var(--muted);font-size:.78rem;margin-top:15px}.legend i{width:14px;height:9px;border-radius:999px;background:#202834;display:inline-block;margin-right:5px}.legend .done-mark{background:#21614f;box-shadow:inset 0 0 0 1px rgba(121,215,177,.32)}.legend .metric-mark{background:#315d94;box-shadow:inset 0 0 0 1px rgba(146,185,238,.36)}.chart-card{min-height:320px}.chart-wrap{height:220px;margin-top:8px;position:relative}.chart{width:100%;height:100%;overflow:visible}.chart .gridline{stroke:var(--line);stroke-width:1}.chart .path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .point{fill:var(--accent);stroke:var(--panel);stroke-width:3}.chart .axis-label{fill:var(--muted);font-size:11px}.chart .point-label{fill:var(--text);font-size:12px;font-weight:700}.chart-note{color:var(--muted);font-size:.85rem;margin:0}.targets{color:var(--muted);font-size:.85rem;margin:0 0 18px}.metric-buttons{display:flex;gap:8px;flex-wrap:wrap}.metric-button{background:var(--bg);border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}.metric-button.active{border-color:var(--accent);color:var(--text)}@media(max-width:720px){main{padding-top:28px}.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}.calendar{grid-template-columns:52px repeat(7,22px);gap:6px}.day{width:22px;height:15px}.day.done::after{font-size:.62rem;line-height:15px}.discipline-head{display:block}.discipline-summary{margin-top:10px}.chart-card{grid-column:span 2}}
</style>
</head>
<body><main>
<h1>Тренировочный дашборд</h1><p class="lead">Тренировки, активность и восстановление.</p>
<nav class="tabs" aria-label="Разделы дашборда"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="recomp">Рекомпозиция</button></nav>
<section class="panel" id="overview"><section class="grid" id="dashboard">Загрузка...</section><section class="card" id="discipline" style="margin-top:16px">Загрузка календаря...</section></section>
<section class="panel" id="recomp" hidden><section class="grid"><article class="card wide"><h2>Рекомпозиция</h2><p class="targets">Ориентир: вес 75–78 кг · жир 15–16% · сохраняем узкую талию.</p><div class="metric-buttons" id="metric-buttons"></div><div class="chart-wrap" id="recomp-chart"></div><p class="chart-note" id="chart-note"></p></article><article class="card wide" id="last-measurement">Загрузка замеров...</article></section></section>
<section class="quote-reminder"><button class="quote-refresh" id="quote-refresh" aria-label="Другая цитата">↻</button><p class="quote-text" id="quote-text">Загрузка...</p><div id="quote-source"></div></section>
</main>
<script>
let quotes=[],qi=-1,measurements=[];const fmtDate=new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'short'});
function quote(){if(!quotes.length)return;let n=Math.floor(Math.random()*quotes.length);if(n===qi)n=(n+1)%quotes.length;qi=n;document.querySelector('#quote-text').textContent=quotes[n].text;document.querySelector('#quote-source').textContent=quotes[n].source}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function calendar(workouts,bodyMetrics){const today=new Date();today.setHours(0,0,0,0);const weekStart=new Date(today);weekStart.setDate(today.getDate()-((today.getDay()+6)%7));const start=new Date(weekStart);start.setDate(weekStart.getDate()-77);const completed=workouts.filter(w=>w.status==='completed'),byDate=completed.reduce((m,w)=>(m[w.date]=(m[w.date]||0)+1,m),{}),metricDates=new Set(bodyMetrics.map(m=>m.date)),weekCount={};completed.forEach(w=>{let d=new Date(w.date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));let key=iso(d);weekCount[key]=(weekCount[key]||0)+1});let cells=['<div></div>',...['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="dow">${x}</div>`)],monthCount=completed.filter(w=>w.date.slice(0,7)===iso(today).slice(0,7)).length;for(let week=0;week<12;week++){let monday=new Date(start);monday.setDate(start.getDate()+week*7);let sunday=new Date(monday);sunday.setDate(monday.getDate()+6);cells.push(`<div class="week">${String(monday.getDate()).padStart(2,'0')}.${String(monday.getMonth()+1).padStart(2,'0')}–${String(sunday.getDate()).padStart(2,'0')}.${String(sunday.getMonth()+1).padStart(2,'0')}</div>`);for(let day=0;day<7;day++){let date=new Date(monday);date.setDate(monday.getDate()+day);let key=iso(date),count=byDate[key]||0,hasMetric=metricDates.has(key),events=[count?`тренировка${count>1?'и: '+count:''}`:'',hasMetric?'замер формы':''].filter(Boolean);cells.push(`<div class="day ${count?'done':''} ${hasMetric?'metric':''} ${key===iso(today)?'today':''}" title="${key}: ${events.join(' · ')||'отдых'}" aria-label="${key}: ${events.join(' · ')||'отдых'}"></div>`)}}let streak=0,probe=new Date(weekStart);while((weekCount[iso(probe)]||0)>=2){streak++;probe.setDate(probe.getDate()-7)}document.querySelector('#discipline').innerHTML=`<div class="discipline-head"><div><h2>График активности · 12 недель</h2><div class="muted">Зелёный — тренировка, синий — замер формы.</div></div><div class="discipline-summary"><span class="pill">${monthCount} трен. в этом месяце</span><span class="pill">цель: 2 в неделю</span><span class="pill">серия активных недель: ${streak||'—'}</span></div></div><div class="calendar">${cells.join('')}</div><div class="legend"><span><i class="done-mark"></i>тренировка</span><span><i class="metric-mark"></i>замер формы</span><span><i></i>отдых</span></div>`}
function renderChart(metric){const cfg={weightKg:{label:'Вес',unit:'кг',color:'#79d7b1'},bodyFatPercent:{label:'Жир',unit:'%',color:'#e3b86d'},waistCm:{label:'Талия',unit:'см',color:'#92b9ee'}}[metric],vals=measurements.map(x=>x[metric]),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(max-min,metric==='bodyFatPercent'?1:2),lo=min-range*.45,hi=max+range*.45,chart=document.querySelector('#recomp-chart');let xs=measurements.map((_,i)=>measurements.length===1?300:48+i*504/(measurements.length-1)),ys=vals.map(v=>12+(hi-v)/(hi-lo)*152),path=xs.map((x,i)=>`${i?'L':'M'} ${x} ${ys[i]}`).join(' ');chart.innerHTML=`<svg class="chart" viewBox="0 0 600 200" role="img" aria-label="${cfg.label}"><line class="gridline" x1="0" y1="12" x2="600" y2="12"/><line class="gridline" x1="0" y1="88" x2="600" y2="88"/><line class="gridline" x1="0" y1="164" x2="600" y2="164"/><text class="axis-label" x="1" y="9">${hi.toFixed(1)} ${cfg.unit}</text><text class="axis-label" x="1" y="185">${lo.toFixed(1)} ${cfg.unit}</text><path class="path" style="stroke:${cfg.color}" d="${path}"/>${xs.map((x,i)=>`<circle class="point" style="fill:${cfg.color}" cx="${x}" cy="${ys[i]}" r="4"/><text class="point-label" x="${x}" y="${ys[i]-10}" text-anchor="middle">${vals[i].toFixed(1)} ${cfg.unit}</text><text class="axis-label" x="${x}" y="198" text-anchor="middle">${fmtDate.format(new Date(measurements[i].date+'T00:00:00'))}</text>`).join('')}</svg>`;document.querySelector('#chart-note').textContent=measurements.length===1?'Первая контрольная точка. После следующего замера здесь появится линия динамики.':`Изменение от первой точки: ${(vals.at(-1)-vals[0]).toFixed(1)} ${cfg.unit}.`}
function recomp(data){measurements=[...data].sort((a,b)=>a.date.localeCompare(b.date));let metrics=['weightKg','bodyFatPercent','waistCm'],root=document.querySelector('#metric-buttons');root.innerHTML=metrics.map((m,i)=>`<button class="metric-button ${i?'':'active'}" data-metric="${m}">${{weightKg:'Вес',bodyFatPercent:'Жир',waistCm:'Талия'}[m]}</button>`).join('');root.onclick=e=>{let b=e.target.closest('button');if(!b)return;root.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderChart(b.dataset.metric)};let last=measurements.at(-1);document.querySelector('#last-measurement').innerHTML=`<h2>Последний замер · ${fmtDate.format(new Date(last.date+'T00:00:00'))}</h2><table><tr><td>Вес</td><td>${last.weightKg.toFixed(1)} кг</td></tr><tr><td>Жир</td><td>${last.bodyFatPercent.toFixed(1)}%</td></tr><tr><td>Талия</td><td>${last.waistCm} см</td></tr><tr><td>Источник</td><td>${last.source||'—'}</td></tr></table>`;renderChart('weightKg')}
document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!==button.dataset.tab)});
fetch('../data/quotes.json').then(r=>r.json()).then(d=>{quotes=d.quotes||[];quote();document.querySelector('#quote-refresh').onclick=quote});
Promise.all([fetch('../data/workouts.json').then(r=>r.json()),fetch('../data/activity.json').then(r=>r.json()),fetch('../data/body-metrics.json').then(r=>r.json())]).then(([wd,ad,bd])=>{let w=wd.workouts||[],a=ad.activities||[],metrics=bd.measurements||[],root=document.querySelector('#dashboard'),last=[...w].sort((x,y)=>y.date.localeCompare(x.date))[0],act=[...a].sort((x,y)=>y.date.localeCompare(x.date))[0];root.innerHTML=`<article class="card"><div class="value">${w.length}</div><div class="label">тренировок</div></article><article class="card"><div class="value">${last.date}</div><div class="label">последняя тренировка</div></article><article class="card"><div class="value">${act?act.durationMinutes+' мин':'—'}</div><div class="label">последняя активность</div></article><article class="card"><div class="value">${act?'❤️ '+act.averageHeartRate:'—'}</div><div class="label">средний пульс активности</div></article><article class="card wide"><h2>Последняя тренировка</h2><table>${last.exercises.slice(0,6).map(e=>`<tr><td>${e.name}</td><td>${e.load} ${e.reps}</td></tr>`).join('')}</table></article><article class="card wide"><h2>Активность</h2><table><tr><td>${act.type}</td><td>${act.durationMinutes} мин · ${act.caloriesKcal} ккал</td></tr><tr><td>Пульс</td><td>${act.averageHeartRate}/${act.maximumHeartRate}</td></tr><tr><td>Восстановление</td><td>${act.recoveryEstimateHours} ч</td></tr></table></article>`;calendar(w,metrics);recomp(metrics)}).catch(()=>document.querySelector('#dashboard').textContent='Не удалось загрузить данные.');
</script></body></html>
