<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Log — Dashboard</title>
<style>
:root{--bg:#0e1116;--panel:#171c24;--muted:#9ca8b8;--text:#f3f6fa;--accent:#79d7b1;--line:#293241;--heat0:#202731;--heat1:#23523f;--heat2:#3a986c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui}main{max-width:1060px;margin:auto;padding:44px 20px 64px}.tabs{display:flex;gap:8px;margin:28px 0 18px}.tab{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);padding:8px 13px;cursor:pointer}.tab.active{background:var(--accent);color:#102018;border-color:var(--accent)}.panel[hidden]{display:none}.grid{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.wide{grid-column:span 2}.value{font-size:2rem;font-weight:750}.label,.lead,.muted{color:var(--muted)}h1{margin:.2em 0}h2{font-size:1.1rem;margin-top:0}table{width:100%;border-collapse:collapse}td{padding:10px 0;border-top:1px solid var(--line)}td:last-child{text-align:right;color:var(--muted)}.calendar{display:grid;grid-template-columns:70px repeat(7,1fr);gap:6px;align-items:center;font-size:.78rem}.day-name{text-align:center;color:var(--muted)}.week-label{color:var(--muted);white-space:nowrap}.day{aspect-ratio:1;border-radius:5px;background:var(--heat0);position:relative;min-height:20px}.day.done{background:var(--heat2)}.day.today{outline:1px solid var(--text)}.day:hover::after{content:attr(data-date);position:absolute;z-index:2;bottom:120%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#080b0f;padding:3px 6px;border-radius:4px}.legend{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.82rem;margin-top:12px}.legend i{width:11px;height:11px;border-radius:3px;background:var(--heat2);display:inline-block}.metric-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.metric{border:1px solid var(--line);background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px;cursor:pointer}.metric.active{color:var(--text);border-color:var(--accent)}.chart{width:100%;height:280px;display:block}.chart text{fill:var(--muted);font-size:12px}.chart .axis{stroke:var(--line)}.chart .line{fill:none;stroke:var(--accent);stroke-width:3}.chart .point{fill:var(--accent)}.quote-reminder{margin-top:30px;padding:18px 42px 0 0;border-top:1px solid var(--line);color:var(--muted);opacity:.82;position:relative}.quote-refresh{position:absolute;right:0;top:14px;background:none;border:0;color:var(--muted)}.quote-text{font-size:.86rem;white-space:pre-line}@media(max-width:720px){main{padding-top:28px}.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}.calendar{grid-template-columns:50px repeat(7,1fr);gap:4px}.week-label{font-size:.66rem}}
</style>
</head>
<body><main>
<h1>Тренировочный дашборд</h1><p class="lead">Тренировки, дисциплина и восстановление.</p>
<nav class="tabs" aria-label="Разделы"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="recomp">Рекомпозиция</button></nav>
<section class="panel" id="overview"><section class="grid" id="dashboard">Загрузка...</section><article class="card" style="margin-top:16px"><h2>Дисциплина — 12 недель</h2><div id="calendar"></div><div class="legend"><i></i>тренировка выполнена <span id="discipline-summary"></span></div></article></section>
<section class="panel" id="recomp" hidden><article class="card"><h2>Рекомпозиция</h2><p class="muted">Замеры тела. После каждого нового замера линия обновится автоматически.</p><div class="metric-tabs"><button class="metric active" data-metric="weight">Вес</button><button class="metric" data-metric="bodyFat">Жир</button><button class="metric" data-metric="waist">Талия</button></div><div id="metric-summary" class="value">—</div><div id="metric-label" class="label"></div><svg class="chart" id="chart" viewBox="0 0 900 280" role="img"></svg></article></section>
<section class="quote-reminder"><button class="quote-refresh" id="quote-refresh" aria-label="Следующая цитата">↻</button><p class="quote-text" id="quote-text">Загрузка...</p><div id="quote-source"></div></section>
</main>
<script>
let quotes=[],qi=-1,metrics=[];
function quote(){if(!quotes.length)return;let n=Math.floor(Math.random()*quotes.length);if(n===qi)n=(n+1)%quotes.length;qi=n;document.querySelector('#quote-text').textContent=quotes[n].text;document.querySelector('#quote-source').textContent=quotes[n].source}
function iso(d){return d.toISOString().slice(0,10)}
function renderCalendar(workouts){
 const el=document.querySelector('#calendar'), done=new Set(workouts.filter(w=>w.status==='completed').map(w=>w.date));
 const today=new Date(); today.setHours(0,0,0,0); const start=new Date(today); start.setDate(start.getDate()-83-start.getDay()+1);
 const names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс']; let out='<div></div>'+names.map(n=>'<div class="day-name">'+n+'</div>').join('');
 for(let week=0;week<12;week++){const monday=new Date(start);monday.setDate(start.getDate()+week*7);out+='<div class="week-label">'+(monday.getDate()+'.'+String(monday.getMonth()+1).padStart(2,'0'))+'</div>';for(let day=0;day<7;day++){const d=new Date(monday);d.setDate(monday.getDate()+day);const key=iso(d);out+='<div class="day '+(done.has(key)?'done ':'')+(key===iso(today)?'today':'')+'" data-date="'+key+'"></div>'}}
 el.innerHTML='<div class="calendar">'+out+'</div>';const currentMonth=iso(today).slice(0,7),count=workouts.filter(w=>w.status==='completed'&&w.date.startsWith(currentMonth)).length;document.querySelector('#discipline-summary').textContent='· '+count+' в этом месяце';
}
const definitions={weight:{label:'Вес',unit:'кг',key:'weightKg'},bodyFat:{label:'Жир',unit:'%',key:'bodyFatPercent'},waist:{label:'Талия',unit:'см',key:'waistCm'}};
function renderChart(name){
 const d=definitions[name], points=metrics.filter(x=>Number.isFinite(Number(x[d.key]))).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({date:x.date,value:Number(x[d.key])}));const svg=document.querySelector('#chart'),summary=document.querySelector('#metric-summary'),label=document.querySelector('#metric-label');
 if(!points.length){svg.innerHTML='';summary.textContent='—';label.textContent='Нет замеров';return} summary.textContent=points.at(-1).value.toLocaleString('ru-RU')+' '+d.unit;label.textContent=d.label+' · последний замер '+points.at(-1).date;
 const W=900,H=280,p={l:62,r:24,t:25,b:45},vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,1),lo=min-pad,hi=max+pad,x=i=>points.length===1?(W-p.l-p.r)/2+p.l:p.l+i*(W-p.l-p.r)/(points.length-1),y=v=>p.t+(hi-v)*(H-p.t-p.b)/(hi-lo);
 let body='<line class="axis" x1="'+p.l+'" y1="'+(H-p.b)+'" x2="'+(W-p.r)+'" y2="'+(H-p.b)+'"/><line class="axis" x1="'+p.l+'" y1="'+p.t+'" x2="'+p.l+'" y2="'+(H-p.b)+'"/>';body+='<text x="8" y="'+(p.t+5)+'">'+hi.toFixed(1)+'</text><text x="8" y="'+(H-p.b+4)+'">'+lo.toFixed(1)+'</text>';body+='<path class="line" d="'+points.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v.value)).join(' ')+'"/>';points.forEach((v,i)=>{body+='<circle class="point" cx="'+x(i)+'" cy="'+y(v.value)+'" r="5"/><text text-anchor="middle" x="'+x(i)+'" y="'+(H-14)+'">'+v.date.slice(5).replace('-','.')+'</text>'});svg.innerHTML=body;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#overview').hidden=b.dataset.tab!=='overview';document.querySelector('#recomp').hidden=b.dataset.tab!=='recomp'});
document.querySelectorAll('.metric').forEach(b=>b.onclick=()=>{document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('active',x===b));renderChart(b.dataset.metric)});
fetch('../data/quotes.json').then(r=>r.json()).then(d=>{quotes=d.quotes||[];quote();document.querySelector('#quote-refresh').onclick=quote});
Promise.all([fetch('../data/workouts.json').then(r=>r.json()),fetch('../data/activity.json').then(r=>r.json()),fetch('../data/body-metrics.json').then(r=>r.json())]).then(([wd,ad,md])=>{let w=wd.workouts||[],a=ad.activities||[],root=document.querySelector('#dashboard');let last=[...w].sort((x,y)=>y.date.localeCompare(x.date))[0];let act=[...a].sort((x,y)=>y.date.localeCompare(x.date))[0];root.innerHTML='<article class="card"><div class="value">'+w.length+'</div><div class="label">тренировок</div></article><article class="card"><div class="value">'+last.date+'</div><div class="label">последняя тренировка</div></article><article class="card"><div class="value">'+(act?act.durationMinutes+' мин':'—')+'</div><div class="label">последняя активность</div></article><article class="card"><div class="value">'+(act?'❤️ '+act.averageHeartRate:'—')+'</div><div class="label">средний пульс активности</div></article><article class="card wide"><h2>Последняя тренировка</h2><table>'+last.exercises.slice(0,6).map(e=>'<tr><td>'+e.name+'</td><td>'+e.load+' '+e.reps+'</td></tr>').join('')+'</table></article><article class="card wide"><h2>Активность</h2><table><tr><td>'+act.type+'</td><td>'+act.durationMinutes+' мин · '+act.caloriesKcal+' ккал</td></tr><tr><td>Пульс</td><td>'+act.averageHeartRate+'/'+act.maximumHeartRate+'</td></tr><tr><td>Восстановление</td><td>'+act.recoveryEstimateHours+' ч</td></tr></table></article>';renderCalendar(w);metrics=md.measurements||[];renderChart('weight');});
</script></body></html>
